version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Primary Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cp_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 Broker & Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cp_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO (S3-Compatible Object Storage)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: cp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-01-18T21-34-31Z
    container_name: cp_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb local/${S3_BUCKET_EVIDENCE:-cp-evidence-screenshots} --ignore-existing;
      /usr/bin/mc mb local/${S3_BUCKET_TESTCASES:-cp-hidden-testcases} --ignore-existing;
      /usr/bin/mc anonymous set none local/${S3_BUCKET_EVIDENCE:-cp-evidence-screenshots};
      /usr/bin/mc anonymous set none local/${S3_BUCKET_TESTCASES:-cp-hidden-testcases};
      exit 0;
      "

  # ----------------------------------------------------------------------------
  # Mailpit (Local SMTP Testing Server)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: cp_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # ----------------------------------------------------------------------------
  # Judge0 CE Sandbox Stack
  # ----------------------------------------------------------------------------
  judge0-db:
    image: postgres:13-alpine
    container_name: judge0_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0_password
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 5

  judge0-redis:
    image: redis:7-alpine
    container_name: judge0_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: judge0_server
    restart: unless-stopped
    privileged: true
    environment:
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0_password
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
      AUTOGENERATE_AUTH_TOKENS: "false"
      ENABLE_AUTH_TOKEN: "false"
      ENABLE_CALLBACKS: "true"
      CALLBACK_MAX_TRIES: 3
    ports:
      - "2358:2358"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_started

  judge0-worker:
    image: judge0/judge0:1.13.1
    container_name: judge0_worker
    restart: unless-stopped
    privileged: true
    environment:
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0_password
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
    depends_on:
      judge0-server:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Platform Backend (FastAPI API Server)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cp_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      judge0-server:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Celery Background Workers
  # ----------------------------------------------------------------------------
  judge-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cp_judge_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker -Q judge_queue,run_queue --concurrency=16 -l info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started

  proctor-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cp_proctor_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker -Q proctor_queue --concurrency=4 -l info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started

  notify-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cp_notify_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker -Q notify_queue --concurrency=2 -l info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Scheduler (PostgreSQL Advisory Lock Single Leader) & Reconciler
  # ----------------------------------------------------------------------------
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cp_scheduler
    restart: unless-stopped
    command: python -m app.scheduler.leader
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started

  reconciler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cp_reconciler
    restart: unless-stopped
    command: python -m app.workers.reconciler
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Platform Frontend (Next.js Application)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cp_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  judge0_db_data:
